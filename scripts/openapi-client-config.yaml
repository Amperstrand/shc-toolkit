# openapi-python-client config for the SHC generated client.
#
# Used by scripts/generate_client.sh. See:
#   https://github.com/openapi-generators/openapi-python-client#configuration
#
# literal_enums: false
#   Emits enums as `class X(str, Enum)` — the normal, importable classes.
#   literal_enums: true was a workaround for the Problem.x-error-code
#   duplicate ("cloud-init-policy-violation" vs "cloud_init_policy_violation"
#   normalizing to the same enum key, GitHub issue #20). The underscore
#   variant was removed from the spec, so the collision is gone — and the
#   workaround replaced every generated enum (163 public classes) with
#   typing.Literal aliases, breaking consumers using ServiceStatus.ACTIVE
#   et al. with AttributeError (PR #34 review, r3693516890). If a duplicate
#   value ever reappears in the spec, fix the SPEC, not the generator mode.
literal_enums: false

# Keep model names readable. Matches the previous default behavior.
use_path_prefixes_for_title_model_names: true

# field_prefix defaults to field_ — keep it; SHC schemas occasionally start
# property names with underscores or collide with Python keywords.
field_prefix: field_

# docstrings on attributes are nice for IDE hover.
docstrings_on_attributes: true
