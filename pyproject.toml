[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shc-toolkit"
version = "2.4.24.2"
description = "Sovereign Hybrid Compute API client, CLI, and NoDNS + Let's Encrypt DNS-01 provisioning"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Amperstrand", email = "dev@amperstrand.com"},
]
dependencies = ["requests>=2.28", "httpx>=0.24"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
nodns = ["nostr-sdk>=0.44"]
console = ["playwright>=1.40"]
tunnel = ["playwright>=1.40", "pytesseract>=0.3", "Pillow>=10.0"]
mcp = ["mcp>=1.0"]
generated = ["httpx>=0.24", "attrs>=21.0", "python-dateutil>=2.8"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/Amperstrand/shc-toolkit"
Documentation = "https://github.com/Amperstrand/shc-toolkit#readme"
SHC_API = "https://blesta.sovereignhybridcompute.com/user-api/docs/"
NoDNS = "https://nodns.shop/"
Changelog = "https://github.com/Amperstrand/shc-toolkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/Amperstrand/shc-toolkit/issues"

[project.scripts]
shc = "shc_toolkit.cli:main"
shc-compute = "shc_toolkit.compute:main"

[tool.setuptools.packages.find]
include = ["shc_toolkit*"]

[tool.ruff]
# Auto-generated client (932 files of codegen) — linting it is meaningless,
# same rationale as the mypy exclude below. CI runs `ruff check shc_toolkit/`.
extend-exclude = ["shc_toolkit/generated"]

[tool.ruff.lint]
# Rules newly enabled by ruff 0.16 default set that this codebase predates.
# Each family is either an intentional pattern or deferred for incremental
# cleanup — none are bugs (245 tests pass with these patterns).
ignore = [
    "BLE001",   # blind-except — intentional in API-client retry/cleanup paths
    "S110",     # try-except-pass — intentional fire-and-forget cleanup (reap, telemetry)
    "S112",     # try-except-continue — same family
    "PLW1510",  # subprocess-run-without-check — provisioning fire-and-forget calls
    "SIM102",   # collapsible-if — readability preference
    "SIM115",   # open-file-without-context-handler — short-lived CLI scripts
    "RUF059",   # unused-unpacked-variable — deferred
    "ISC004",   # implicit-string-concatenation — deferred
    "PIE810",   # multiple-starts-ends-with — deferred
    "PERF102",  # incorrect-dict-iterator — deferred
    "RUF007",   # zip-instead-of-pairwise — deferred
    "DTZ005",   # call-datetime-now-without-tzinfo — CLI tool, local time intended
]

[tool.mypy]
exclude = "shc_toolkit/generated/"

# Generated client is codegen (excluded above) but mypy still follows imports
# into it from hand-written code; skip those so codegen template quirks don't
# surface as type errors in our CI.
[[tool.mypy.overrides]]
module = "shc_toolkit.generated.*"
follow_imports = "skip"
