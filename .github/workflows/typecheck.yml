---
# Type checking + linting on every push/PR.
#
# The codebase uses PEP 604 union types (str | None) and
# from __future__ import annotations, so mypy with Python 3.11+
# target is required.
#
# AGENTS.md mandates both `ruff check` (lint) AND `ruff format --check`
# (formatting) must be clean. Both run here.

name: typecheck

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mypy:
    name: mypy type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install mypy types-requests
      - run: mypy shc_toolkit/ --ignore-missing-imports --no-strict-optional

  ruff:
    name: ruff lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install ruff==0.16.5
      - run: ruff check shc_toolkit/ tests/ scripts/
      - run: ruff format --check shc_toolkit/ tests/ scripts/
