---
# PyPI publishing workflow.
#
# Triggers on tag push (v*.*.*) and uses PyPI Trusted Publishing
# (OIDC — no API token needed). Configure at:
# https://pypi.org/manage/project/shc-toolkit/settings/publishing/
#
# ⚠ OWNER ACTION REQUIRED (known-broken since first tag — v2.4.3.1, v2.4.24.1,
# v2.4.24.2 all failed with `invalid-publisher`): register the trusted
# publisher on pypi.org ONCE — account → Publishing → "Add a new pending
# publisher": owner=Amperstrand, repo=shc-toolkit, workflow=publish.yml,
# environment=pypi. Until then every tag's publish job fails after the
# build succeeds; the tag + sdist/wheel artifact are still valid releases
# for GitHub consumers.
#
# To release:
#   git tag v0.6.0
#   git push origin v0.6.0

name: publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
