---
name: coverage

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  coverage:
    name: Test coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -e . -q && pip install pytest pytest-cov pyyaml -q
      - name: Run tests with coverage
        run: python -m pytest tests/test_unit.py tests/test_github_runner.py tests/test_ansible.py tests/test_network_fixture.py --cov=shc_toolkit --cov-report=term-missing --cov-report=xml
      - name: Upload coverage XML
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30
