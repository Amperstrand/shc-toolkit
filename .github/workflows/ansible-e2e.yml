---
# Workflow: monthly live E2E for the ansible/ subtree.
#
# Runs the full playbook.yml + teardown.yml against a real SHC VM
# every 7th at 03:00 UTC. Catches regressions that molecule can't:
# the SHC API integration, NoDNS publishing, certbot DNS-01 against
# real Let's Encrypt, and end-to-end HTTPS verification.
#
# Default VM: Katy NVMe (nvme-1c-4gb) — the playbook needs no nested
# KVM, and the Dev zone (Cherryvale) is unroutable since 2026-08-27
# (issue #39; dev-zone-watch.yml tracks it). Pass vm_size=dev-* only
# when deliberately testing that zone.
#
# Cost: ~$0.01-0.05 per run (cancel-at-order + prorated refund).
#
# Can be triggered manually via workflow_dispatch.

name: ansible-e2e

on:
  schedule:
    - cron: '0 3 7 * *'  # Monthly: 7th 03:00 UTC
  workflow_dispatch:
    inputs:
      vm_size:
        description: 'shc_vm_size override (default nvme-1c-4gb; dev-* = unstable zone)'
        required: false
        default: 'nvme-1c-4gb'
        type: string

permissions:
  issues: write

jobs:
  live-e2e:
    name: Full playbook against real SHC VM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install shc-toolkit + ansible
        run: |
          pip install -e .
          pip install ansible-core

      # The play's shc_vm role reads ~/.ssh/id_ed25519.pub for live key
      # injection — runners have none (found by the 09-09 dispatch: the
      # play ordered the VM, then died on FileNotFoundError).
      - name: Generate ephemeral SSH key
        run: ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519

      - name: Run provisioning playbook
        working-directory: ansible
        env:
          SHC_API_KEY: ${{ secrets.SHC_API_KEY }}
          SHC_GITHUB_ADMIN_TOKEN: dummy  # playbook doesn't use this; suppress warning
        run: |
          ansible-playbook -i localhost, playbook.yml -e certbot_staging=true \
            -e shc_vm_size='${{ inputs.vm_size || 'nvme-1c-4gb' }}'
        continue-on-error: true
        id: provision

      - name: Capture provision output
        if: always()
        working-directory: ansible
        run: |
          echo "=== Provision exit: ${{ steps.provision.outcome }} ==="

      - name: Tear down any VMs created
        if: always()
        working-directory: ansible
        env:
          SHC_API_KEY: ${{ secrets.SHC_API_KEY }}
        run: |
          # Best-effort cleanup: reap orphan VMs older than 1 hour.
          # reap_orphan_vms.py is dry-run by default; --execute cancels.
          python3 ../scripts/reap_orphan_vms.py --max-age 1 --execute || true

      - name: Fail job if provision failed
        if: steps.provision.outcome != 'success'
        run: |
          echo "::error::Provisioning playbook failed — see logs above"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci-failure'
            });
            if (issues.data.some(i => i.title.includes('ansible-e2e failed'))) {
              core.info('Issue already open, skipping');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'ansible-e2e failed',
              body: [
                `The monthly ansible live E2E failed: ${runUrl}`,
                '',
                'Default VM is Katy NVMe (nvme-1c-4gb) since the Dev zone is',
                'unroutable (issue #39). If the order step timed out with a',
                'dev-* size, that is expected until #39 closes —',
                'dev-zone-watch.yml posts fresh probe evidence there weekly.'
              ].join('\n'),
              labels: ['ci-failure', 'bug']
            });
