repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: ['--fix']
        files: 'shc_toolkit/.*\.py$'
      - id: ruff-format
        files: 'shc_toolkit/.*\.py$'
  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest (unit tests only, no API calls)
        entry: python3 -m pytest tests/test_unit.py tests/test_github_runner.py tests/test_ansible.py tests/test_network_fixture.py --timeout=10 -q --tb=no
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
